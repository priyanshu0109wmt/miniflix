<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Details - MiniFlix</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">MINIFLIX</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="mylist.html">My List</a>
        <a href="pricing.html">Plans</a>
        <a href="admin.html">Admin</a>
        <a href="profile.html">Profile</a>
      </div>
    </div>
        <div class="nav-right">
      <div class="search-box">
        <input type="text" placeholder="Search movies..." id="navSearch" />
      </div>

      <!-- 🔔 Notification Bell -->
      <div class="notif-wrapper" id="notifWrapper">
        <button class="notif-bell" id="notifBell">
          🔔
          <span class="notif-badge hidden" id="notifBadge">0</span>
        </button>
        <div class="notif-dropdown hidden" id="notifDropdown">
          <div class="notif-header">
            <span>Notifications</span>
            <button class="notif-mark-read" id="markReadBtn">Mark all read</button>
          </div>
          <div class="notif-list" id="notifList">
            <p class="notif-empty">No notifications yet.</p>
          </div>
        </div>
      </div>

      <a href="profile.html" class="avatar">U</a>
      <a href="login.html" class="btn-small" id="navLoginBtn">Login</a>
    </div>
  </nav>

  <!-- Movie Detail Hero -->
  <main class="movie-detail-page">
    <section class="movie-detail-hero" id="detailHero">
      <div class="detail-hero-overlay"></div>
      <div class="detail-hero-content">
        <a href="index.html" class="back-btn">← Back to Home</a>
        
        <div class="detail-hero-info">
          <div class="detail-poster">
            <img id="moviePoster" src="" alt="Movie Poster" />
          </div>
          
          <div class="detail-info">
            <span class="hero-tag">Movie Details</span>
            <h1 id="movieTitle">Loading...</h1>
            
            <div class="detail-meta" id="movieMeta"></div>
            <p class="detail-description" id="movieDesc"></p>
            
            <div class="detail-actions">
              <a href="#" id="playBtn" class="btn btn-red">Play</a>
              <button id="addToListBtn" class="btn btn-light">+ My List</button>
              <div class="star-rating" id="starRating">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
              </div>
            </div>
            
            <div class="detail-extra" id="movieExtra"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- More Like This -->
    <section class="movie-row">
      <div class="row-header"><h2>More Like This</h2></div>
      <div class="row-cards" id="relatedMovies"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="mylist.html">My List</a>
      <a href="pricing.html">Plans</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html">Admin</a>
      <a href="#">Help</a>
    </div>
    <p>MiniFlix Clone - Made for resume project using HTML, CSS, JavaScript, Node.js and MySQL.</p>
  </footer>

  <script src="js/config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const movieId = params.get("id");

    async function loadMovieDetails() {
      if (!movieId) {
        document.querySelector(".detail-info").innerHTML = "<h1>No movie ID provided</h1>";
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/movies/${movieId}`);
        const movie = await response.json();

        if (!response.ok) {
          document.querySelector(".detail-info").innerHTML = `<h1>${movie.message || "Movie not found"}</h1>`;
          return;
        }

        document.getElementById("movieTitle").textContent = movie.title;
        document.getElementById("moviePoster").src = movie.image;
        document.getElementById("movieDesc").textContent = movie.description;
        document.getElementById("detailHero").style.backgroundImage = `url('${movie.image}')`;
        document.getElementById("playBtn").href = `watch.html?id=${movie.id}`;
        
        document.getElementById("movieMeta").innerHTML = `
          <span class="meta-badge green">98% Match</span>
          <span>${movie.year}</span>
          <span class="meta-badge">16+</span>
          <span>${movie.genre}</span>
        `;

        document.getElementById("movieExtra").innerHTML = `
          <p><span>Genres:</span> ${movie.genre}</p>
          <p><span>Added:</span> ${new Date(movie.created_at).toLocaleDateString()}</p>
        `;

        loadRelatedMovies(movie.genre, movie.id);
      } catch (error) {
        console.error(error);
        document.querySelector(".detail-info").innerHTML = "<h1>Failed to load movie details</h1>";
      }
    }

    async function loadRelatedMovies(genre, currentId) {
      try {
        const res = await fetch(`${API_BASE}/api/movies`);
        const movies = await res.json();
        const related = movies.filter(m => m.id != currentId).slice(0, 5);
        
        document.getElementById("relatedMovies").innerHTML = related.map(m => `
          <article class="movie-card">
            <img src="${m.image}" alt="${m.title}" />
            <div class="card-gradient"></div>
            <div class="card-body">
              <h3>${m.title}</h3>
              <p>${m.year} • ${m.genre}</p>
              <div class="card-actions">
                <a href="watch.html?id=${m.id}" class="card-btn red">Play</a>
                <a href="movie.html?id=${m.id}" class="card-btn">Details</a>
              </div>
            </div>
          </article>
        `).join("");
      } catch(e) { console.error(e); }
    }

    // ---------- Watchlist Toggle ----------
    const addToListBtn = document.getElementById("addToListBtn");
    addToListBtn.addEventListener("click", async function() {
      const token = localStorage.getItem("token");
      if (!token) {
        alert("Please login first to add movies to your list.");
        window.location.href = "login.html";
        return;
      }

      const isAdded = this.textContent.includes("✓");
      try {
        if (isAdded) {
          const res = await fetch(`${API_BASE}/api/watchlist/${movieId}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
          });
          if (res.ok) {
            this.textContent = "+ My List";
            this.classList.remove("added");
          }
        } else {
          const res = await fetch(`${API_BASE}/api/watchlist`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ movieId: parseInt(movieId) })
          });
          if (res.ok) {
            this.textContent = "✓ Added to My List";
            this.classList.add("added");
          } else {
            const data = await res.json();
            alert(data.message || "Failed to add movie");
          }
        }
      } catch (error) {
        console.error(error);
        alert("Server error. Make sure backend is running.");
      }
    });

    // ---------- Star Rating ----------
    const stars = document.querySelectorAll(".star");
    let currentRating = 0;

    function highlightStars(score) {
      stars.forEach((star, index) => {
        // Light up stars 1 through score (index 0 = star 1)
        if (index < score) {
          star.classList.add("active");
        } else {
          star.classList.remove("active");
        }
      });
    }

    stars.forEach(star => {
      star.addEventListener("click", async function() {
        const token = localStorage.getItem("token");
        if (!token) {
          alert("Please login to rate movies.");
          window.location.href = "login.html";
          return;
        }

        const score = parseInt(this.getAttribute("data-value"));
        const id = parseInt(movieId);

        if (!id || isNaN(score) || score < 1 || score > 5) {
          console.error("Invalid rating data:", { id, score });
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/api/ratings`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ movieId: id, score: score })
          });

          if (res.ok) {
            currentRating = score;
            highlightStars(score);
          } else {
            const err = await res.json();
            alert(err.message || "Failed to save rating.");
          }
        } catch (error) {
          console.error(error);
          alert("Server error.");
        }
      });

      star.addEventListener("mouseenter", function() {
        const hoverScore = parseInt(this.getAttribute("data-value"));
        highlightStars(hoverScore);
      });
    });

    document.getElementById("starRating").addEventListener("mouseleave", function() {
      // Reset to last saved rating (or clear if none)
      highlightStars(currentRating);
    });
      async function loadSavedRating() {
      const token = localStorage.getItem("token");
      if (!token || !movieId) return;

      try {
        const res = await fetch(`${API_BASE}/api/ratings/${movieId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (res.ok) {
          const data = await res.json();
          if (data && data.score) {
            currentRating = data.score;
            highlightStars(currentRating);
          }
        }
      } catch (error) {
        console.error(error);
      }
    }

    // ---------- Search & Nav ----------
    document.getElementById("navSearch").addEventListener("keypress", function(e) {
      if (e.key === "Enter" && this.value.trim()) {
        window.location.href = `search.html?q=${encodeURIComponent(this.value)}`;
      }
    });

    function updateNav() {
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user"));
      const loginBtn = document.getElementById("navLoginBtn");
      const avatar = document.querySelector(".avatar");
      if (token && user) {
        loginBtn.textContent = "Logout";
        loginBtn.onclick = (e) => { 
          e.preventDefault(); 
          localStorage.removeItem("token"); 
          localStorage.removeItem("user"); 
          location.reload(); 
        };
        avatar.textContent = user.name.charAt(0).toUpperCase();
      }
    }

    // Initialize
    loadMovieDetails();
    loadSavedRating()
    updateNav();
  </script>
  <script src="js/notifications.js"></script>
</body>
</html>
